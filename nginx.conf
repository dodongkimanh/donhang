server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html và service worker không bao giờ được cache ở trình duyệt —
    # nếu không, sau mỗi lần deploy, SW/HTML cũ có thể bị kẹt lại và trỏ tới
    # các file JS đã bị thay thế (hash đổi), khiến trang lỗi và phải F5 nhiều lần.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* (?:^|/)(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # File JS/CSS có hash trong tên nên an toàn để cache dài hạn
    location ~* \.(?:js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
